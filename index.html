<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My TodoList</title><script defer="defer" src="main.js"></script></head><body><div class="content-wrapper"><div class="sidebar"><div class="sidebar-wrapper"><div class="user"><img src="8195098008847c831497.jpeg" alt="user-avatar"><div class="user-info"><div>DemonFrog</div><div>dfrog911@gmail.com</div></div></div><div class="list"><div class="list-title"><h2>My list</h2><div class="addlistbtn">+</div></div><dialog id="addlist"><form action="" id="listform"><h2>Your new List!</h2><div class="holder"><label for="listname">List Title:</label> <input id="listname" required></div><div class="button-set"><button class="confirm-list-btn" type="submit">Confirm</button> <button class="cancel-list-btn">Cancel</button></div></form></dialog><div class="list-container"></div></div></div><div class="collapse-btn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="25px" class="menu"><title>menu</title><path d="M3,6H21V8H3V6M3,11H21V13H3V11M3,16H21V18H3V16Z"/></svg></div></div><div class="main"><div class="search-bar-area"><input id="search-bar" placeholder="Sorted by title"> <select name="times" id="time-select"><option value="all">All</option><option value="week">In a week</option><option value="month">In a month</option></select></div><div class="todos-area"></div><dialog id="addtodos"><form action="" class="todosform"><h2>New Todos</h2><div class="formcontrol"><label for="todosname">Title:</label> <input id="todosname" required> <input type="date" id="duedate" max="2026-12-31" required></div><div class="formcontrol"><label for="detail">Detail:</label> <textarea id="detail" cols="24" rows="2" maxlength="75"></textarea></div><div class="button-set"><button class="confirm-todos-btn" type="submit">Confirm</button> <button class="cancel-todos-btn">Cancel</button></div></form></dialog><div class="change-pic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="50px"><title>sync</title><path d="M12,18A6,6 0 0,1 6,12C6,11 6.25,10.03 6.7,9.2L5.24,7.74C4.46,8.97 4,10.43 4,12A8,8 0 0,0 12,20V23L16,19L12,15M12,4V1L8,5L12,9V6A6,6 0 0,1 18,12C18,13 17.75,13.97 17.3,14.8L18.76,16.26C19.54,15.03 20,13.57 20,12A8,8 0 0,0 12,4Z"/></svg></div></div></div></body></html>
