<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My TodoList</title>
</head>
<body>
    <div class="content-wrapper">
        <div class="sidebar">
            <div class="sidebar-wrapper">
                <div class="user">
                    <img src="./pic/user.jpeg" alt="user-avatar">
                    <div class="user-info">
                        <div>DemonFrog</div>
                        <div>dfrog911@gmail.com</div>
                    </div>
                </div>
                <div class="list">
                    <div class="list-title">
                        <h2>My list</h2>
                        <div class="addlistbtn">+</div>
                    </div>
                    <dialog id="addlist">
                        <form action="" id="listform">
                            <h2>Your new List!</h2>
                            <div class="holder">
                                <label for="listname">List Title:</label>
                                <input type="text" id="listname" required>
                            </div>
                            <div class="button-set">
                                <button class="confirm-list-btn" type="submit">Confirm</button>
                                <button class="cancel-list-btn">Cancel</button>
                            </div>
                        </form>
                    </dialog>
                    <div class="list-container"></div>
                </div>
            </div>
            <div class="collapse-btn"></div>
        </div>
        <div class="main">
            <div class="search-bar-area">
                <input type="text" id="search-bar" placeholder="Sorted by title">
            </div>
            <div class="todos-area"></div>
            <dialog id="addtodos">
                <form action="" class="todosform">
                    <h2>New Todos</h2>
                    
                    <div class="formcontrol">
                        <label for="todosname">Title:</label>
                        <input type="text" id="todosname" required>
                        <input type="date" 
                               id="duedate" 
                               max="2026-12-31"
                               required>
                    </div>

                    <div class="formcontrol">
                        <label for="detail">Detail:</label>
                        <textarea id="detail" cols="24" rows="2" maxlength="75"></textarea>
                    </div>

                    <div class="button-set">
                        <button class="confirm-todos-btn" type="submit">Confirm</button>
                        <button class="cancel-todos-btn">Cancel</button>
                    </div>
                </form>
            </dialog>
        </div>
    </div>
</body>
</html>
